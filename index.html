<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>تسوق الآن</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="DC74693F-A700-4922-9101-B6DD6E3843EA.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --teal:#38bdf8; --teal-dark:#0284c7; --teal-light:#e6f6fe;
  --amber:#f59e0b;
  --bg:#f5f6f8; --card:#ffffff; --text:#1f2937; --muted:#8a93a3; --border:#edeff2;
  --danger:#e5484d;
  --wa:#25d366;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}

/* ===== Top bar ===== */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;
  padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;
}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px}
.topbar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.iconBtn{
  width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.15);
  color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative
}
.adminChip{
  position:absolute;top:-4px;left:-4px;background:var(--amber);color:#3a2500;font-size:9px;
  font-weight:800;padding:1px 5px;border-radius:6px
}

/* ===== Search & categories ===== */
.searchWrap{padding:14px 16px 4px 16px}
.searchBox{
  display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:11px 14px;box-shadow:0 2px 8px rgba(15,23,42,.04)
}
.searchBox input{border:none;outline:none;flex:1;font-family:inherit;font-size:15px;background:transparent}
.searchBox .ic{color:var(--muted)}

.catsRow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px 16px;scrollbar-width:none}
.catsRow::-webkit-scrollbar{display:none}
.catChip{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  background:var(--card);border:1px solid var(--border);color:var(--text);font-size:13.5px;
  font-weight:600;cursor:pointer;white-space:nowrap
}
.catChip.active{background:var(--teal);border-color:var(--teal);color:#fff}

.sectionTitle{padding:16px 16px 6px 16px;font-weight:800;font-size:15px;color:var(--text)}

/* ===== Feed grid ===== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px 20px 16px}
.card{
  background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--border);
  box-shadow:0 2px 10px rgba(15,23,42,.05);display:flex;flex-direction:column
}
.card .imgWrap{width:100%;aspect-ratio:1/1;background:var(--teal-light);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .imgWrap img{width:100%;height:100%;object-fit:cover}
.card .imgWrap .ph{font-size:28px;opacity:.5}
.card .body{padding:10px 12px 12px 12px;display:flex;flex-direction:column;gap:4px}
.card h4{margin:0;font-size:13.5px;font-weight:700;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .price{color:var(--teal-dark);font-weight:800;font-size:15px}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.card .catTag{font-size:10.5px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:7px}
.card .time{font-size:10.5px;color:var(--muted)}
.card .actions{display:flex;gap:6px;margin-top:8px}
.card .actions a,.card .actions button{
  flex:1;border:none;border-radius:9px;padding:7px 0;font-size:12.5px;font-weight:700;
  cursor:pointer;text-decoration:none;text-align:center;display:block
}
.waBtn{background:var(--wa);color:#fff}
.delBtn{background:#fdeceb;color:var(--danger)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}

/* ===== Bottom nav ===== */
.bottomNav{
  position:fixed;bottom:0;right:0;left:0;z-index:30;background:#fff;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
}
.navItem{
  background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;flex:1;padding:4px 0
}
.navItem .navIcon{font-size:19px}
.navItem.active{color:var(--teal)}
.fabWrap{flex:1;display:flex;justify-content:center;margin-top:-26px}
.fab{
  width:52px;height:52px;border-radius:50%;background:var(--amber);color:#3a2500;
  border:5px solid var(--bg);font-size:24px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 6px 14px rgba(245,158,11,.4)
}

/* ===== Screens: add form ===== */
.screen{background:var(--bg);min-height:100%}
.screenHeader{
  display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--card);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:15
}
.screenHeader .back{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text)}
.screenHeader h3{margin:0;font-size:16px;font-weight:800}
.formArea{padding:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select{
  width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
  font-family:inherit;font-size:15px;background:var(--card)
}
.imgPickBox{
  width:100%;min-height:120px;border:2px dashed var(--border);border-radius:12px;
  background:var(--card);display:flex;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;color:var(--muted);font-size:13.5px;text-align:center;padding:10px
}
.imgPickBox img{width:100%;max-height:220px;object-fit:cover;border-radius:10px}
.btnMain{
  width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:800;
  color:#fff;background:var(--teal);cursor:pointer
}
.btnGhost{
  width:100%;padding:13px;border:none;border-radius:12px;font-size:14.5px;font-weight:700;
  color:var(--teal-dark);background:var(--teal-light);cursor:pointer;margin-top:8px
}

/* ===== Overlay (auth / account) ===== */
.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;
  display:flex;align-items:flex-end;justify-content:center
}
.sheet{
  background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));
  animation:up .18s ease-out
}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet h3{margin:0 0 14px 0;font-size:17px;font-weight:800}
.sheet .accountEmail{font-size:14px;color:var(--muted);margin-bottom:16px;word-break:break-all}

.hidden{display:none!important}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>تسوق الآن</div>
  <button class="iconBtn" onclick="openAccount()" title="حسابي">
    👤<span id="adminChip" class="adminChip hidden">A</span>
  </button>
</div>

<!-- ===== HOME ===== -->
<div id="home">
  <div class="searchWrap">
    <div class="searchBox">
      <span class="ic">🔎</span>
      <input id="searchInput" placeholder="ابحث عن سيارة، عقار، وظيفة..." oninput="loadPosts()">
    </div>
  </div>

  <div class="catsRow">
    <button class="catChip active" data-cat="الكل" onclick="filterCategory('الكل')">✨ الكل</button>
    <button class="catChip" data-cat="سيارات" onclick="filterCategory('سيارات')">🚗 سيارات</button>
    <button class="catChip" data-cat="دراجات" onclick="filterCategory('دراجات')">🏍️ دراجات</button>
    <button class="catChip" data-cat="العاب" onclick="filterCategory('العاب')">🎮 العاب</button>
    <button class="catChip" data-cat="عقارات" onclick="filterCategory('عقارات')">🏠 عقارات</button>
    <button class="catChip" data-cat="وظائف" onclick="filterCategory('وظائف')">💼 وظائف</button>
  </div>

  <div class="sectionTitle" id="homeTitle">أحدث الإعلانات</div>
  <div class="grid" id="posts"></div>
</div>

<!-- ===== ADD FORM SCREEN ===== -->
<div id="form" class="screen hidden">
  <div class="screenHeader">
    <button class="back" onclick="showHome()">→</button>
    <h3>إضافة إعلان</h3>
  </div>
  <div class="formArea">
    <div class="field"><label>عنوان الإعلان</label><input id="title" placeholder="مثال: تويوتا كورولا 2018"></div>
    <div class="field"><label>السعر (د.ل)</label><input id="price" type="number" placeholder="0"></div>
    <div class="field"><label>التصنيف</label>
      <select id="category">
        <option>سيارات</option><option>دراجات</option><option>العاب</option><option>عقارات</option><option>وظائف</option>
      </select>
    </div>
    <div class="field"><label>رقم الواتساب للتواصل</label><input id="phone" placeholder="218912345678"></div>
    <div class="field"><label>رابط صورة (اختياري)</label><input id="imageUrl" placeholder="https://..."></div>
    <button class="btnMain" id="saveBtn" onclick="savePost()">نشر الإعلان</button>
  </div>
</div>

<!-- ===== BOTTOM NAV ===== -->
<div class="bottomNav">
  <button class="navItem active" id="navHome" onclick="showHome()"><span class="navIcon">🏠</span>الرئيسية</button>
  <button class="navItem" id="navMine" onclick="showMyPosts()"><span class="navIcon">📋</span>إعلاناتي</button>
  <div class="fabWrap"><button class="fab" onclick="showForm()">+</button></div>
  <button class="navItem" id="navAccount" onclick="openAccount()"><span class="navIcon">👤</span><span id="navAccountLabel">حسابي</span></button>
</div>

<!-- ===== AUTH OVERLAY ===== -->
<div id="authOverlay" class="overlay hidden">
  <div class="sheet">
    <h3>تسجيل الدخول / إنشاء حساب</h3>
    <div class="field"><input id="email" placeholder="البريد الإلكتروني"></div>
    <div class="field"><input id="password" type="password" placeholder="كلمة المرور"></div>
    <button class="btnMain" onclick="login()">دخول</button>
    <button class="btnGhost" style="background:#fff;border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px" onclick="loginWithGoogle()">
      <span>🔵</span> المتابعة عبر جوجل
    </button>
    <button class="btnGhost" onclick="register()">إنشاء حساب جديد</button>
    <button class="btnGhost" style="background:transparent;color:var(--muted)" onclick="closeOverlay()">إلغاء</button>
  </div>
</div>

<!-- ===== ACCOUNT OVERLAY ===== -->
<div id="accountOverlay" class="overlay hidden">
  <div class="sheet">
    <h3>حسابي</h3>
    <div class="accountEmail" id="accountEmail"></div>
    <button class="btnMain" style="background:var(--danger)" onclick="logout();closeOverlay()">تسجيل الخروج</button>
    <button class="btnGhost" style="background:transparent;color:var(--muted)" onclick="closeOverlay()">إغلاق</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,GoogleAuthProvider,signInWithRedirect,getRedirectResult } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { getFirestore,collection,addDoc,onSnapshot,deleteDoc,doc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
import { getStorage,ref,uploadBytes,getDownloadURL } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-storage.js";

const firebaseConfig={
apiKey:"AIzaSyBuhnSrkn6jXcCxUnbL-o14gd5pS9wRmnY",
authDomain:"tasawuq-now-eb955.firebaseapp.com",
projectId:"tasawuq-now-eb955",
storageBucket:"tasawuq-now-eb955.firebasestorage.app",
messagingSenderId:"786110830242",
appId:"1:786110830242:web:15a4752cd9b5db3f0129fb"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth();
const db=getFirestore();
const storage=getStorage(app);

const ADMIN_EMAIL="abdoalk73@gmail.com";
let isAdmin=false;
let showOnlyMine=false;
let currentCategory="الكل";
let allPosts=[];
let pendingAction=null;

const home=document.getElementById("home");
const form=document.getElementById("form");
const postsBox=document.getElementById("posts");
const homeTitle=document.getElementById("homeTitle");
const authOverlay=document.getElementById("authOverlay");
const accountOverlay=document.getElementById("accountOverlay");
const adminChip=document.getElementById("adminChip");
const navHome=document.getElementById("navHome");
const navMine=document.getElementById("navMine");
const navAccountLabel=document.getElementById("navAccountLabel");

startPostsListener();

onAuthStateChanged(auth,user=>{
if(user){
isAdmin=user.email===ADMIN_EMAIL;
adminChip.classList.toggle("hidden",!isAdmin);
navAccountLabel.textContent="حسابي";
closeOverlay();
if(pendingAction==="form"){showForm();}
else if(pendingAction==="mine"){showMyPosts();}
else{renderPosts();}
pendingAction=null;
}else{
isAdmin=false;
adminChip.classList.add("hidden");
navAccountLabel.textContent="دخول";
if(showOnlyMine){showHome();}
renderPosts();
}
});

window.register=()=>createUserWithEmailAndPassword(auth,email.value,password.value).catch(e=>alert(e.message));
window.login=()=>signInWithEmailAndPassword(auth,email.value,password.value).catch(e=>alert(e.message));
window.logout=()=>signOut(auth);

const googleProvider=new GoogleAuthProvider();
window.loginWithGoogle=()=>signInWithRedirect(auth,googleProvider).catch(e=>alert(e.message));
getRedirectResult(auth).catch(e=>{if(e && e.code!=="auth/no-current-user")console.error(e);});

window.closeOverlay=()=>{authOverlay.classList.add("hidden");accountOverlay.classList.add("hidden");pendingAction=null;};

window.openAccount=()=>{
if(auth.currentUser){
document.getElementById("accountEmail").textContent=auth.currentUser.email;
accountOverlay.classList.remove("hidden");
}else{
pendingAction=null;
authOverlay.classList.remove("hidden");
}
};

function setActiveNav(which){
navHome.classList.toggle("active",which==="home");
navMine.classList.toggle("active",which==="mine");
}

window.showHome=()=>{
showOnlyMine=false;
homeTitle.textContent="أحدث الإعلانات";
home.classList.remove("hidden");
form.classList.add("hidden");
closeOverlay();
setActiveNav("home");
renderPosts();
};

window.showForm=()=>{
if(!auth.currentUser){pendingAction="form";authOverlay.classList.remove("hidden");return;}
home.classList.add("hidden");
form.classList.remove("hidden");
closeOverlay();
};

window.showMyPosts=()=>{
if(!auth.currentUser){pendingAction="mine";authOverlay.classList.remove("hidden");return;}
showOnlyMine=true;
homeTitle.textContent="إعلاناتي";
home.classList.remove("hidden");
form.classList.add("hidden");
closeOverlay();
setActiveNav("mine");
renderPosts();
};

window.filterCategory=(cat)=>{
currentCategory=cat;
document.querySelectorAll(".catChip").forEach(b=>b.classList.toggle("active",b.dataset.cat===cat));
renderPosts();
};

window.loadPosts=()=>renderPosts();

function startPostsListener(){
onSnapshot(collection(db,"posts"),snapshot=>{
allPosts=snapshot.docs.map(d=>({id:d.id,...d.data()}));
allPosts.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
renderPosts();
},err=>{
console.error(err);
postsBox.innerHTML="<div class='empty'>تعذر تحميل الإعلانات، تحقق من قواعد Firestore (يجب السماح بالقراءة العامة).</div>";
});
}

function timeAgo(ts){
if(!ts)return"";
const diff=Math.floor((Date.now()-ts)/1000);
if(diff<60)return"الآن";
if(diff<3600)return Math.floor(diff/60)+" د";
if(diff<86400)return Math.floor(diff/3600)+" س";
return Math.floor(diff/86400)+" يوم";
}

function renderPosts(){
const term=(document.getElementById("searchInput")?.value||"").trim().toLowerCase();
let list=allPosts.filter(p=>{
if(currentCategory!=="الكل" && p.category!==currentCategory)return false;
if(showOnlyMine && p.uid!==auth.currentUser?.uid)return false;
if(term && !(p.title||"").toLowerCase().includes(term))return false;
return true;
});

if(list.length===0){
postsBox.innerHTML="<div class='empty'>لا توجد إعلانات هنا حالياً</div>";
return;
}

postsBox.innerHTML=list.map(p=>{
const canDelete=isAdmin||(auth.currentUser && p.uid===auth.currentUser.uid);
const img=p.imageUrl
?`<img src="${escapeHtml(p.imageUrl)}" onerror="this.parentElement.innerHTML='<span class=ph>🖼️</span>'">`
:`<span class="ph">🖼️</span>`;
const wa=p.phone?`<a class="waBtn" target="_blank" href="https://wa.me/${encodeURIComponent(p.phone.replace(/[^0-9]/g,''))}">واتساب</a>`:"";
const del=canDelete?`<button class="delBtn" onclick="deletePost('${p.id}')">حذف</button>`:"";
return `
<div class="card">
  <div class="imgWrap">${img}</div>
  <div class="body">
    <h4>${escapeHtml(p.title||"بدون عنوان")}</h4>
    <div class="price">${p.price!=null?p.price+" د.ل":""}</div>
    <div class="meta"><span class="catTag">${escapeHtml(p.category||"")}</span><span class="time">${timeAgo(p.createdAt)}</span></div>
    <div class="actions">${wa}${del}</div>
  </div>
</div>`;
}).join("");
}

function escapeHtml(str){
return String(str).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

window.savePost=async()=>{
if(!auth.currentUser){pendingAction="form";authOverlay.classList.remove("hidden");return;}
const title=document.getElementById("title").value.trim();
const price=document.getElementById("price").value;
const category=document.getElementById("category").value;
const phone=document.getElementById("phone").value.trim();
const imageUrl=document.getElementById("imageUrl").value.trim();
const saveBtn=document.getElementById("saveBtn");

if(!title||!price){alert("الرجاء إدخال العنوان والسعر");return;}

saveBtn.disabled=true;
saveBtn.textContent="جاري النشر...";

try{
await addDoc(collection(db,"posts"),{
title,price:Number(price),category,phone,imageUrl,
uid:auth.currentUser.uid,
email:auth.currentUser.email,
createdAt:Date.now()
});
document.getElementById("title").value="";
document.getElementById("price").value="";
document.getElementById("phone").value="";
document.getElementById("imageUrl").value="";
showHome();
}catch(e){
alert("خطأ أثناء الحفظ: "+e.message);
}finally{
saveBtn.disabled=false;
saveBtn.textContent="نشر الإعلان";
}
};

window.deletePost=async(id)=>{
if(!confirm("هل تريد حذف هذا الإعلان؟"))return;
try{
await deleteDoc(doc(db,"posts",id));
}catch(e){
alert("خطأ أثناء الحذف: "+e.message);
}
};
</script>

</body>
</html>
