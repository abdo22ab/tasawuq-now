<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>تسوق الآن</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="DC74693F-A700-4922-9101-B6DD6E3843EA.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --teal:#38bdf8; --teal-dark:#0284c7; --teal-light:#e6f6fe;
  --amber:#f59e0b;
  --bg:#f5f6f8; --card:#ffffff; --text:#1f2937; --muted:#8a93a3; --border:#edeff2;
  --danger:#e5484d;
  --wa:#25d366;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}

/* ===== Top bar ===== */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;
  padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;
}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px}
.topbar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.iconBtn{
  width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.15);
  color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative
}
.adminChip{
  position:absolute;top:-4px;left:-4px;background:var(--amber);color:#3a2500;font-size:9px;
  font-weight:800;padding:1px 5px;border-radius:6px
}

/* ===== Search & categories ===== */
.searchWrap{padding:14px 16px 4px 16px;display:flex;gap:8px;align-items:stretch}
.searchWrap .searchBox{flex:1;min-width:0}
.cityFilter{
  flex:0 0 auto;max-width:118px;border:1px solid var(--border);border-radius:14px;background:var(--card);
  padding:0 8px;font-family:inherit;font-size:13px;font-weight:700;color:var(--text);
  box-shadow:0 2px 8px rgba(15,23,42,.04)
}
.cityLine{font-size:11.5px;color:var(--muted)}
.searchBox{
  display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:11px 14px;box-shadow:0 2px 8px rgba(15,23,42,.04)
}
.searchBox input{border:none;outline:none;flex:1;font-family:inherit;font-size:15px;background:transparent}
.searchBox .ic{color:var(--muted)}

.catsRow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px 16px;scrollbar-width:none}
.catsRow::-webkit-scrollbar{display:none}
.catChip{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  background:var(--card);border:1px solid var(--border);color:var(--text);font-size:13.5px;
  font-weight:600;cursor:pointer;white-space:nowrap
}
.catChip.active{background:var(--teal);border-color:var(--teal);color:#fff}

.sectionTitle{padding:16px 16px 6px 16px;font-weight:800;font-size:15px;color:var(--text)}

/* ===== Feed grid ===== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px 20px 16px}
.card{
  background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--border);
  box-shadow:0 2px 10px rgba(15,23,42,.05);display:flex;flex-direction:column
}
.card .imgWrap{position:relative;width:100%;aspect-ratio:1/1;background:var(--teal-light);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .imgWrap img{width:100%;height:100%;object-fit:cover}
.card .imgWrap .ph{font-size:28px;opacity:.5}
.card .body{padding:10px 12px 12px 12px;display:flex;flex-direction:column;gap:4px}
.card h4{margin:0;font-size:13.5px;font-weight:700;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .price{color:var(--teal-dark);font-weight:800;font-size:15px}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.card .catTag{font-size:10.5px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:7px}
.card .time{font-size:10.5px;color:var(--muted)}
.card .actions{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.card .actions a.waBtn{
  flex:1 1 auto;border:none;border-radius:9px;padding:7px 0;font-size:12.5px;font-weight:700;
  cursor:pointer;text-decoration:none;text-align:center;display:block
}
.waBtn{background:var(--wa);color:#fff}
.iconBtn2{
  width:28px;height:28px;flex:0 0 auto;border:none;border-radius:8px;cursor:pointer;
  font-size:13px;display:flex;align-items:center;justify-content:center
}
.editBtn{background:#eef2ff}
.delBtn{background:#fdeceb}
.reportBtn{background:#fff3cd}
.imgCountBadge{
  position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;
  font-size:10px;padding:2px 6px;border-radius:8px
}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}

/* ===== Bottom nav ===== */
.bottomNav{
  position:fixed;bottom:0;right:0;left:0;z-index:30;background:#fff;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
}
.navItem{
  background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;flex:1;padding:4px 0
}
.navItem .navIcon{font-size:19px}
.navItem.active{color:var(--teal)}
.fabWrap{flex:1;display:flex;justify-content:center;margin-top:-26px}
.fab{
  width:52px;height:52px;border-radius:50%;background:var(--amber);color:#3a2500;
  border:5px solid var(--bg);font-size:24px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 6px 14px rgba(245,158,11,.4)
}

/* ===== Screens: add form ===== */
.screen{background:var(--bg);min-height:100%}
.screenHeader{
  display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--card);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:15
}
.screenHeader .back{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text)}
.screenHeader h3{margin:0;font-size:16px;font-weight:800}
.formArea{padding:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select{
  width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
  font-family:inherit;font-size:15px;background:var(--card)
}
.imgThumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.imgThumb{position:relative;width:70px;height:70px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.imgThumb img{width:100%;height:100%;object-fit:cover}
.imgThumb .rm{
  position:absolute;top:2px;left:2px;background:rgba(0,0,0,.6);color:#fff;border:none;
  border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;cursor:pointer
}
.imgAddTile{
  border:2px dashed var(--border);border-radius:12px;padding:14px;text-align:center;
  color:var(--muted);font-size:13.5px;cursor:pointer;background:var(--card)
}
.imgAddTile.hidden{display:none}
.btnMain{
  width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:800;
  color:#fff;background:var(--teal);cursor:pointer
}
.btnGhost{
  width:100%;padding:13px;border:none;border-radius:12px;font-size:14.5px;font-weight:700;
  color:var(--teal-dark);background:var(--teal-light);cursor:pointer;margin-top:8px
}

/* ===== Overlay (auth / account) ===== */
.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;
  display:flex;align-items:flex-end;justify-content:center
}
.sheet{
  background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));
  animation:up .18s ease-out
}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet h3{margin:0 0 14px 0;font-size:17px;font-weight:800}
.sheet .accountEmail{font-size:14px;color:var(--muted);margin-bottom:16px;word-break:break-all}

.reportItem{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.reportItem .rTitle{font-weight:800;font-size:14px;margin-bottom:2px}
.reportItem .rMeta{font-size:12px;color:var(--muted);margin-bottom:8px}
.reportItem .rActions{display:flex;gap:8px}
.reportItem .rActions button{flex:1;border:none;border-radius:9px;padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer}
.rDelete{background:#fdeceb;color:var(--danger)}
.rDismiss{background:var(--bg);color:var(--muted)}
.reportsEmpty{text-align:center;color:var(--muted);padding:20px 0;font-size:14px}

.hidden{display:none!important}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>تسوق الآن</div>
  <button class="iconBtn" onclick="openAccount()" title="حسابي">
    👤<span id="adminChip" class="adminChip hidden">A</span>
  </button>
</div>

<!-- ===== HOME ===== -->
<div id="home">
  <div class="searchWrap">
    <div class="searchBox">
      <span class="ic">🔎</span>
      <input id="searchInput" placeholder="ابحث..." oninput="loadPosts()">
    </div>
    <select id="cityFilter" class="cityFilter" onchange="filterCity()"></select>
  </div>

  <div class="catsRow">
    <button class="catChip active" data-cat="الكل" onclick="filterCategory('الكل')">✨ الكل</button>
    <button class="catChip" data-cat="سيارات ومركبات" onclick="filterCategory('سيارات ومركبات')">🚗 سيارات ومركبات</button>
    <button class="catChip" data-cat="دراجات نارية" onclick="filterCategory('دراجات نارية')">🏍️ دراجات نارية</button>
    <button class="catChip" data-cat="دراجات هوائية" onclick="filterCategory('دراجات هوائية')">🚲 دراجات هوائية</button>
    <button class="catChip" data-cat="الخدمات" onclick="filterCategory('الخدمات')">🛠️ الخدمات</button>
    <button class="catChip" data-cat="عقارات للبيع" onclick="filterCategory('عقارات للبيع')">🏠 عقارات للبيع</button>
    <button class="catChip" data-cat="عقارات للإيجار" onclick="filterCategory('عقارات للإيجار')">🔑 عقارات للإيجار</button>
    <button class="catChip" data-cat="موبايل وتابلت" onclick="filterCategory('موبايل وتابلت')">📱 موبايل وتابلت</button>
    <button class="catChip" data-cat="لابتوب وكمبيوتر" onclick="filterCategory('لابتوب وكمبيوتر')">💻 لابتوب وكمبيوتر</button>
    <button class="catChip" data-cat="ألعاب وألعاب الفيديو" onclick="filterCategory('ألعاب وألعاب الفيديو')">🎮 ألعاب وألعاب الفيديو</button>
    <button class="catChip" data-cat="أجهزة منزلية" onclick="filterCategory('أجهزة منزلية')">🧊 أجهزة منزلية</button>
    <button class="catChip" data-cat="ملابس رجالية" onclick="filterCategory('ملابس رجالية')">👔 ملابس رجالية</button>
    <button class="catChip" data-cat="ملابس نسائية" onclick="filterCategory('ملابس نسائية')">👗 ملابس نسائية</button>
    <button class="catChip" data-cat="ملابس أطفال" onclick="filterCategory('ملابس أطفال')">👶 ملابس أطفال</button>
    <button class="catChip" data-cat="جمال وصحة" onclick="filterCategory('جمال وصحة')">💆 جمال وصحة</button>
    <button class="catChip" data-cat="مكياج" onclick="filterCategory('مكياج')">💄 مكياج</button>
    <button class="catChip" data-cat="مطاعم وغداء" onclick="filterCategory('مطاعم وغداء')">🍽️ مطاعم وغداء</button>
    <button class="catChip" data-cat="إلكترونيات" onclick="filterCategory('إلكترونيات')">🔌 إلكترونيات</button>
  </div>

  <div class="sectionTitle" id="homeTitle">أحدث الإعلانات</div>
  <div class="grid" id="posts"></div>
</div>

<!-- ===== ADD FORM SCREEN ===== -->
<div id="form" class="screen hidden">
  <div class="screenHeader">
    <button class="back" onclick="showHome()">→</button>
    <h3 id="formHeaderTitle">إضافة إعلان</h3>
  </div>
  <div class="formArea">
    <div class="field"><label>عنوان الإعلان</label><input id="title" placeholder="مثال: تويوتا كورولا 2018"></div>

        <option>سيارات ومركبات</option>

        <option>الخدمات</option>
        <option>عقارات للبيع</option>
        <option>عقارات للإيجار</option>
        <option>موبايل وتابلت</option>
        <option>لابتوب وكمبيوتر</option>
        <option>ألعاب وألعاب الفيديو</option>
        <option>أجهزة منزلية</option>
        <option>ملابس رجالية</option>
        <option>ملابس نسائية</option>
        <option>ملابس أطفال</option>
        <option>جمال وصحة</option>
        <option>مكياج</option>
        <option>مطاعم وغداء</option>
        <option>إلكترونيات</option>
      </select>
    </div>
    <div class="field"><label>المدينة</label>
      <select id="city"></select>
    </div>
    <div class="field"><label>رقم الواتساب للتواصل</label><input id="phone" placeholder="218912345678"></div>
    <div class="field">
      <label>صور الإعلان (اختياري - حتى 5 صور)</label>
      <div id="imgThumbs" class="imgThumbs"></div>
      <div id="imgAddTile" class="imgAddTile" onclick="document.getElementById('imageFile').click()">📷 إضافة صورة</div>
      <input id="imageFile" type="file" accept="image/*" multiple class="hidden" onchange="handleFilesSelected()">
    </div>
    <button class="btnMain" id="saveBtn" onclick="savePost()">نشر الإعلان</button>
  </div>
</div>

<!-- ===== BOTTOM NAV ===== -->
<div class="bottomNav">
  <button class="navItem active" id="navHome" onclick="showHome()"><span class="navIcon">🏠</span>الرئيسية</button>
  <button class="navItem" id="navMine" onclick="showMyPosts()"><span class="navIcon">📋</span>إعلاناتي</button>
  <div class="fabWrap"><button class="fab" onclick="showForm()">+</button></div>
  <button class="navItem" id="navAccount" onclick="openAccount()"><span class="navIcon">👤</span><span id="navAccountLabel">حسابي</span></button>
</div>

<!-- ===== AUTH OVERLAY ===== -->
<div id="authOverlay" class="overlay hidden">
  <div class="sheet">
    <h3>تسجيل الدخول / إنشاء حساب</h3>
    <div class="field"><input id="email" placeholder="البريد الإلكتروني"></div>
    <div class="field"><input id="password" type="password" placeholder="كلمة المرور"></div>
    <button class="btnMain" onclick="login()">دخول</button>
    <button class="btnGhost" style="background:#fff;border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px" onclick="loginWithGoogle()">
      <span>🔵</span> المتابعة عبر جوجل
    </button>
    <button class="btnGhost" onclick="register()">إنشاء حساب جديد</button>
    <button class="btnGhost" style="background:transparent;color:var(--muted)" onclick="closeOverlay()">إلغاء</button>
  </div>
</div>

<!-- ===== ACCOUNT OVERLAY ===== -->
<div id="accountOverlay" class="overlay hidden">
  <div class="sheet">
    <h3>حسابي</h3>
    <div class="accountEmail" id="accountEmail"></div>
    <button id="reportsBtn" class="btnGhost hidden" onclick="openReports()">🚩 الإبلاغات</button>
    <button class="btnMain" style="background:var(--danger)" onclick="logout();closeOverlay()">تسجيل الخروج</button>
    <button class="btnGhost" style="background:transparent;color:var(--muted)" onclick="closeOverlay()">إغلاق</button>
  </div>
</div>

<!-- ===== REPORTS OVERLAY (admin only) ===== -->
<div id="reportsOverlay" class="overlay hidden">
  <div class="sheet" style="max-height:75vh;overflow-y:auto">
    <h3>الإبلاغات</h3>
    <div id="reportsList"></div>
    <button class="btnGhost" style="background:transparent;color:var(--muted)" onclick="closeOverlay()">إغلاق</button>
  </div>
</div>

<script type="module">

};

startPostsListener();

onAuthStateChanged(auth,user=>{

adminChip.classList.toggle("hidden",!isAdmin);
navAccountLabel.textContent="حسابي";

window.register=()=>createUserWithEmailAndPassword(auth,email.value,password.value).catch(e=>alert(e.message));

window.logout=()=>signOut(auth);

const googleProvider=new GoogleAuthProvider();
window.loginWithGoogle=()=>signInWithRedirect(auth,googleProvider).catch(e=>alert(e.message));
getRedirectResult(auth).catch(e=>{if(e && e.code!=="auth/no-current-user")console.error(e);});

window.closeOverlay=()=>{authOverlay.classList.add("hidden");accountOverlay.classList.add("hidden");reportsOverlay.classList.add("hidden");pendingAction=null;};

window.openAccount=()=>{
if(auth.currentUser){
document.getElementById("accountEmail").textContent=auth.currentUser.email;
reportsBtn.classList.toggle("hidden",!isAdmin);
accountOverlay.classList.remove("hidden");
}else{
pendingAction=null;
authOverlay.classList.remove("hidden");
}
};

window.openReports=()=>{
renderReports();
reportsOverlay.classList.remove("hidden");
accountOverlay.classList.add("hidden");
};

function setActiveNav(which){
navHome.classList.toggle("active",which==="home");
navMine.classList.toggle("active",which==="mine");
}

window.showHome=()=>{
showOnlyMine=false;
homeTitle.textContent="أحدث الإعلانات";
home.classList.remove("hidden");
form.classList.add("hidden");
closeOverlay();
setActiveNav("home");
renderPosts();
};

function openFormScreen(){
home.classList.add("hidden");
form.classList.remove("hidden");
closeOverlay();
}

window.showForm=()=>{
if(!auth.currentUser){pendingAction="form";authOverlay.classList.remove("hidden");return;}
const myCount=allPosts.filter(p=>p.uid===auth.currentUser.uid).length;
if(myCount>=3){
alert("وصلت للحد الأقصى المسموح به (3 إعلانات لكل حساب). احذف إعلاناً قديماً إذا تحب تضيف إعلان جديد.");
return;
}
editingPostId=null;
document.getElementById("formHeaderTitle").textContent="إضافة إعلان";
document.getElementById("saveBtn").textContent="نشر الإعلان";
document.getElementById("title").value="";
document.getElementById("price").value="";
document.getElementById("phone").value="";
document.getElementById("city").value="";
selectedImages=[];
renderImagePicker();
openFormScreen();
};

window.editPost=(id)=>{
if(!auth.currentUser)return;
const post=allPosts.find(p=>p.id===id);
if(!post)return;
editingPostId=id;
document.getElementById("formHeaderTitle").textContent="تعديل الإعلان";
document.getElementById("saveBtn").textContent="حفظ التعديلات";
document.getElementById("title").value=post.title||"";
document.getElementById("price").value=post.price||"";
document.getElementById("category").value=post.category||"سيارات ومركبات";
document.getElementById("city").value=post.city||"";
document.getElementById("phone").value=post.phone||"";
const existing=(post.images && post.images.length)?post.images:(post.imageUrl?[post.imageUrl]:[]);
selectedImages=existing.map(url=>({type:"existing",url}));
renderImagePicker();
openFormScreen();
};

window.showMyPosts=()=>{
if(!auth.currentUser){pendingAction="mine";authOverlay.classList.remove("hidden");return;}
showOnlyMine=true;
homeTitle.textContent="إعلاناتي";
home.classList.remove("hidden");
form.classList.add("hidden");
closeOverlay();
setActiveNav("mine");
renderPosts();
};

function populateCitySelects(){
const groups=Object.entries(LIBYA_CITIES).map(([region,cities])=>
`<optgroup label="${region}">${cities.map(c=>`<option value="${c}">${c}</option>`).join("")}</optgroup>`
).join("");
document.getElementById("cityFilter").innerHTML=`<option value="الكل">📍 كل المدن</option>${groups}`;
document.getElementById("city").innerHTML=`<option value="">اختر المدينة</option>${groups}`;
}
populateCitySelects();

window.filterCity=()=>{
currentCity=document.getElementById("cityFilter").value;
renderPosts();
};

window.filterCategory=(cat)=>{
currentCategory=cat;
document.querySelectorAll(".catChip").forEach(b=>b.classList.toggle("active",b.dataset.cat===cat));
renderPosts();
};

window.loadPosts=()=>renderPosts();

function startPostsListener(){
onSnapshot(collection(db,"posts"),snapshot=>{
allPosts=snapshot.docs.map(d=>({id:d.id,...d.data()}));
allPosts.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
renderPosts();
},err=>{
console.error(err);
postsBox.innerHTML="<div class='empty'>تعذر تحميل الإعلانات، تحقق من قواعد Firestore (يجب السماح بالقراءة العامة).</div>";
});
}

function timeAgo(ts){
if(!ts)return"";
const diff=Math.floor((Date.now()-ts)/1000);
if(diff<60)return"الآن";
if(diff<3600)return Math.floor(diff/60)+" د";
if(diff<86400)return Math.floor(diff/3600)+" س";
return Math.floor(diff/86400)+" يوم";
}

function renderPosts(){
const term=(document.getElementById("searchInput")?.value||"").trim().toLowerCase();
let list=allPosts.filter(p=>{
if(currentCategory!=="الكل" && p.category!==currentCategory)return false;
if(currentCity!=="الكل" && p.city!==currentCity)return false;
if(showOnlyMine && p.uid!==auth.currentUser?.uid)return false;
if(term && !(p.title||"").toLowerCase().includes(term))return false;
return true;
});

if(list.length===0){
postsBox.innerHTML="<div class='empty'>لا توجد إعلانات هنا حالياً</div>";
return;
}

postsBox.innerHTML=list.map(p=>{
const canDelete=isAdmin||(auth.currentUser && p.uid===auth.currentUser.uid);
const images=(p.images && p.images.length)?p.images:(p.imageUrl?[p.imageUrl]:[]);
const img=images.length
?`<img src="${escapeHtml(images[0])}" onerror="this.parentElement.innerHTML='<span class=ph>🖼️</span>'">`
:`<span class="ph">🖼️</span>`;
const countBadge=images.length>1?`<span class="imgCountBadge">📷 ${images.length}</span>`:"";
const wa=p.phone?`<a class="waBtn" target="_blank" href="https://wa.me/${encodeURIComponent(p.phone.replace(/[^0-9]/g,''))}">واتساب</a>`:"";
const edit=canDelete?`<button class="iconBtn2 editBtn" title="تعديل" onclick="editPost('${p.id}')">✏️</button>`:"";
const del=canDelete?`<button class="iconBtn2 delBtn" title="حذف" onclick="deletePost('${p.id}')">🗑️</button>`:"";
const report=`<button class="iconBtn2 reportBtn" title="إبلاغ" onclick="reportPost('${p.id}')">🚩</button>`;
return `
<div class="card">
  <div class="imgWrap">${img}${countBadge}</div>
  <div class="body">
    <h4>${escapeHtml(p.title||"بدون عنوان")}</h4>
    <div class="price">${p.price!=null?p.price+" د.ل":""}</div>
    ${p.city?`<div class="cityLine">📍 ${escapeHtml(p.city)}</div>`:""}
    <div class="meta"><span class="catTag">${escapeHtml(p.category||"")}</span><span class="time">${timeAgo(p.createdAt)}</span></div>
    <div class="actions">${wa}${edit}${del}${report}</div>
  </div>
</div>`;
}).join("");
}

function escapeHtml(str){
return String(str).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderImagePicker(){
const box=document.getElementById("imgThumbs");
box.innerHTML=selectedImages.map((item,i)=>{
const src=item.type==="existing"?item.url:item.previewUrl;
return `<div class="imgThumb"><img src="${escapeHtml(src)}"><button class="rm" onclick="removeImage(${i})">×</button></div>`;
}).join("");
document.getElementById("imgAddTile").classList.toggle("hidden",selectedImages.length>=5);
}

window.removeImage=(i)=>{
selectedImages.splice(i,1);
renderImagePicker();
};

window.handleFilesSelected=()=>{
const input=document.getElementById("imageFile");
const files=Array.from(input.files);
const remaining=5-selectedImages.length;
files.slice(0,remaining).forEach(file=>{
selectedImages.push({type:"new",file,previewUrl:URL.createObjectURL(file)});
});
input.value="";
renderImagePicker();
};

async function uploadToImgBB(file){
const formData=new FormData();
formData.append("image",file);
const res=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`,{
method:"POST",
body:formData
});
const data=await res.json();
if(!data.success)throw new Error("فشل رفع الصورة");
return data.data.url;
}

window.savePost=async()=>{
if(!auth.currentUser){pendingAction="form";authOverlay.classList.remove("hidden");return;}
const title=document.getElementById("title").value.trim();
const price=document.getElementById("price").value;
const category=document.getElementById("category").value;
const city=document.getElementById("city").value;
const phone=document.getElementById("phone").value.trim();
const saveBtn=document.getElementById("saveBtn");
const wasEditing=!!editingPostId;

if(!title||!price){alert("الرجاء إدخال العنوان والسعر");return;}
if(!city){alert("الرجاء اختيار المدينة");return;}

if(!wasEditing){
const myCount=allPosts.filter(p=>p.uid===auth.currentUser.uid).length;
if(myCount>=3){
alert("وصلت للحد الأقصى المسموح به (3 إعلانات لكل حساب).");
return;
}
}

saveBtn.disabled=true;
saveBtn.textContent=wasEditing?"جاري الحفظ...":"جاري النشر...";

try{
const images=[];
for(const item of selectedImages){
if(item.type==="existing"){images.push(item.url);}
else{
saveBtn.textContent="جاري رفع الصور...";
images.push(await uploadToImgBB(item.file));
}
}

if(wasEditing){
await updateDoc(doc(db,"posts",editingPostId),{title,price:Number(price),category,city,phone,images});
}else{
await addDoc(collection(db,"posts"),{
title,price:Number(price),category,city,phone,images,
uid:auth.currentUser.uid,
email:auth.currentUser.email,
createdAt:Date.now()
});
}

editingPostId=null;
document.getElementById("title").value="";
document.getElementById("price").value="";
document.getElementById("phone").value="";
selectedImages=[];
renderImagePicker();
showHome();
}catch(e){
alert("خطأ أثناء الحفظ: "+e.message);
}finally{
saveBtn.disabled=false;
saveBtn.textContent=editingPostId?"حفظ التعديلات":"نشر الإعلان";
}
};

window.reportPost=async(id)=>{
if(!auth.currentUser){pendingAction=null;authOverlay.classList.remove("hidden");return;}
const reason=prompt("سبب الإبلاغ (اختياري):");
if(reason===null)return;
try{
const post=allPosts.find(p=>p.id===id);
await addDoc(collection(db,"reports"),{
postId:id,
postTitle:post?post.title:"",
reason:reason||"",
reporterEmail:auth.currentUser.email,
reporterUid:auth.currentUser.uid,
createdAt:Date.now()
});
alert("تم إرسال الإبلاغ، شكراً لك");
}catch(e){
alert("تعذر إرسال الإبلاغ: "+e.message);
}
};

function startReportsListener(){
onSnapshot(collection(db,"reports"),snapshot=>{
allReports=snapshot.docs.map(d=>({id:d.id,...d.data()}));
allReports.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
renderReports();
reportsBtn.textContent=allReports.length?`🚩 الإبلاغات (${allReports.length})`:"🚩 الإبلاغات";
});
}

function renderReports(){
const list=document.getElementById("reportsList");
if(!list)return;
if(allReports.length===0){
list.innerHTML="<div class='reportsEmpty'>لا توجد إبلاغات حالياً</div>";
return;
}
list.innerHTML=allReports.map(r=>`
<div class="reportItem">
<div class="rTitle">${escapeHtml(r.postTitle||"إعلان محذوف")}</div>
<div class="rMeta">${escapeHtml(r.reason||"بدون سبب محدد")} — ${escapeHtml(r.reporterEmail||"")}</div>
<div class="rActions">
<button class="rDelete" onclick="deleteReportedPost('${r.postId}','${r.id}')">حذف الإعلان</button>
<button class="rDismiss" onclick="dismissReport('${r.id}')">تجاهل</button>
</div>
</div>`).join("");
}

window.dismissReport=async(reportId)=>{
try{await deleteDoc(doc(db,"reports",reportId));}
catch(e){alert("خطأ: "+e.message);}
};

window.deleteReportedPost=async(postId,reportId)=>{
if(!confirm("حذف الإعلان المبلّغ عنه نهائياً؟"))return;
try{
await deleteDoc(doc(db,"posts",postId));
await deleteDoc(doc(db,"reports",reportId));
}catch(e){alert("خطأ: "+e.message);}
};

window.deletePost=async(id)=>{
if(!confirm("هل تريد حذف هذا الإعلان؟"))return;
try{
await deleteDoc(doc(db,"posts",id));
}catch(e){
alert("خطأ أثناء الحذف: "+e.message);
}
};
</script>
