<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>تسوق الآن</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="DC74693F-A700-4922-9101-B6DD6E3843EA.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --teal:#38bdf8; --teal-dark:#0284c7; --teal-light:#e6f6fe;
  --amber:#f59e0b;
  --bg:#f5f6f8; --card:#ffffff; --text:#1f2937; --muted:#8a93a3; --border:#edeff2;
  --danger:#e5484d;
  --wa:#25d366;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}

/* ===== Top bar ===== */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;
  padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;
}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px}
.topbar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.iconBtn{
  width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.15);
  color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative
}
.adminChip{
  position:absolute;top:-4px;left:-4px;background:var(--amber);color:#3a2500;font-size:9px;
  font-weight:800;padding:1px 5px;border-radius:6px
}

/* ===== Search & categories ===== */
.searchWrap{padding:14px 16px 4px 16px}
.searchBox{
  display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:11px 14px;box-shadow:0 2px 8px rgba(15,23,42,.04)
}
.searchBox input{border:none;outline:none;flex:1;font-family:inherit;font-size:15px;background:transparent}
.searchBox .ic{color:var(--muted)}

.catsRow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px 16px;scrollbar-width:none}
.catsRow::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px 20px 16px}
.card{
  background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--border);
  box-shadow:0 2px 10px rgba(15,23,42,.05);display:flex;flex-direction:column
}
.card .imgWrap{width:100%;aspect-ratio:1/1;background:var(--teal-light);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .imgWrap img{width:100%;height:100%;object-fit:cover}
.card .imgWrap .ph{font-size:28px;opacity:.5}
.card .body{padding:10px 12px 12px 12px;display:flex;flex-direction:column;gap:4px}
.card h4{margin:0;font-size:13.5px;font-weight:700;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .price{color:var(--teal-dark);font-weight:800;font-size:15px}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.card .catTag{font-size:10.5px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:7px}
.card .time{font-size:10.5px;color:var(--muted)}
.card .actions{display:flex;gap:6px;margin-top:8px}
.card .actions a,.card .actions button{
  flex:1;border:none;border-radius:9px;padding:7px 0;font-size:12.5px;font-weight:700;
  cursor:pointer;text-decoration:none;text-align:center;display:block
}
.waBtn{background:var(--wa);color:#fff}
.delBtn{background:#fdeceb;color:var(--danger)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}

/* ===== Bottom nav ===== */
.bottomNav{
  position:fixed;bottom:0;right:0;left:0;z-index:30;background:#fff;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
}
.navItem{
  background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;flex:1;padding:4px 0
}
.navItem .navIcon{font-size:19px}
.navItem.active{color:var(--teal)}
.fabWrap{flex:1;display:flex;justify-content:center;margin-top:-26px}
.fab{
saveBtn.disabled=true;
saveBtn.textContent="جاري النشر...";

try{
await addDoc(collection(db,"posts"),{
title,price:Number(price),category,phone,imageUrl,
uid:auth.currentUser.uid,
email:auth.currentUser.email,
createdAt:Date.now()
});
document.getElementById("title").value="";
document.getElementById("price").value="";
document.getElementById("phone").value="";
document.getElementById("imageUrl").value="";
showHome();
}catch(e){
alert("خطأ أثناء الحفظ: "+e.message);
}finally{
saveBtn.disabled=false;
saveBtn.textContent="نشر الإعلان";
}
};

window.deletePost=async(id)=>{
if(!confirm("هل تريد حذف هذا الإعلان؟"))return;
try{
await deleteDoc(doc(db,"posts",id));
}catch(e){
alert("خطأ أثناء الحذف: "+e.message);
}
};
</script>

</body>
</html>
